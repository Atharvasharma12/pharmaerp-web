name: PharmaERP Bot Commit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot-commit:
    name: Create Bot Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure PharmaERP Bot
        run: |
          git config user.name "PharmaERP Bot"
          git config user.email "pharmaerp.tech@gmail.com"

      - name: Create Bot Commit
        run: |
          git commit --allow-empty \
            -m "chore: automated update by PharmaERP Bot"

      - name: Push Bot Commit
        run: |
          git push origin main