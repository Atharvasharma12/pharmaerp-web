name: PharmaERP Bot Commit

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - development
          - uat
          - production

permissions:
  contents: write

jobs:
  bot-commit:
    name: Bot Commit - ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Set branch
        id: branch
        run: |
          case "${{ inputs.environment }}" in
            development)
              echo "branch=develop" >> "$GITHUB_OUTPUT"
              ;;
            uat)
              echo "branch=uat" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "branch=main" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0

      - name: Configure PharmaERP Bot
        run: |
          git config user.name "PharmaERP Bot"
          git config user.email "pharmaerp.tech@gmail.com"

      - name: Create Bot Commit
        run: |
          git commit --allow-empty \
            -m "chore: automated deployment by PharmaERP Bot"

      - name: Push Bot Commit
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"